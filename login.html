<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — CSVNow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--teal:#0D9488;--teal-dark:#0F766E;--teal-light:#CCFBF1;--teal-xlight:#F0FDFA;--text:#0f172a;--text3:#64748b;--border:#e2e8f0;}
    body{font-family:'DM Sans',sans-serif;background:var(--teal-xlight);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
    .logo{font-family:'Syne',sans-serif;font-weight:800;font-size:24px;color:var(--teal);text-decoration:none;margin-bottom:32px;}
    .logo span{color:var(--text);}
    .card{background:white;border-radius:16px;padding:40px;width:100%;max-width:420px;box-shadow:0 4px 24px rgba(13,148,136,0.1);}
    h1{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;color:var(--text);margin-bottom:8px;}
    .sub{font-size:14px;color:var(--text3);margin-bottom:28px;}
    .field{margin-bottom:16px;}
    label{font-size:13px;font-weight:500;color:var(--text);display:block;margin-bottom:6px;}
    input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s;}
    input:focus{border-color:var(--teal);}
    .btn{width:100%;background:var(--teal);color:white;border:none;padding:12px;border-radius:50px;font-size:15px;font-weight:500;cursor:pointer;margin-top:8px;transition:background .2s;}
    .btn:hover{background:var(--teal-dark);}
    .divider{text-align:center;font-size:13px;color:var(--text3);margin:20px 0;}
    .btn-google{width:100%;background:white;color:var(--text);border:1.5px solid var(--border);padding:11px;border-radius:50px;font-size:14px;font-weight:500;cursor:pointer;transition:border-color .2s;}
    .btn-google:hover{border-color:var(--teal);}
    .footer-link{text-align:center;font-size:13px;color:var(--text3);margin-top:20px;}
    .footer-link a{color:var(--teal);text-decoration:none;font-weight:500;}
    .error{background:#fef2f2;color:#ef4444;font-size:13px;padding:10px 14px;border-radius:8px;margin-bottom:16px;display:none;}
    .success{background:var(--teal-light);color:var(--teal-dark);font-size:13px;padding:10px 14px;border-radius:8px;margin-bottom:16px;display:none;}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <a href="index.html" class="logo">CSV<span>Now</span></a>
  <div class="card">
    <h1>Welcome back</h1>
    <p class="sub">Log in to access your Pro or Business features.</p>
    <div class="error" id="error-msg"></div>
    <div class="success" id="success-msg"></div>
    <div class="field">
      <label>Email address</label>
      <input type="email" id="email" placeholder="you@example.com" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" />
    </div>
    <button class="btn" onclick="handleLogin()">Log in</button>
    <div class="divider">or</div>
    <button class="btn-google" onclick="handleGoogle()">Continue with Google</button>
    <div class="footer-link">Don't have an account? <a href="signup.html">Sign up</a></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://scxkbtypfmdaeuytbcaz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjeGtidHlwZm1kYWV1eXRiY2F6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MTU0NjgsImV4cCI6MjA5NDA5MTQ2OH0.YlOCebdFuEPHZfkN1bSaD3BXzMpq3nAx5ArIqfvj6tA';
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('success-msg').style.display = 'none';
    }

    function showSuccess(msg) {
      const el = document.getElementById('success-msg');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('error-msg').style.display = 'none';
    }

    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) { showError('Please enter your email and password.'); return; }
      const { error } = await _supabase.auth.signInWithPassword({ email, password });
      if (error) { showError(error.message); return; }
      showSuccess('Logged in! Redirecting...');
      setTimeout(() => { window.location.href = 'index.html'; }, 1000);
    }

    async function handleGoogle() {
      const { error } = await _supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + '/index.html' } });
      if (error) showError(error.message);
    }

    // Check if already logged in
    _supabase.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = 'index.html';
    });
  </script>
</body>
</html>
